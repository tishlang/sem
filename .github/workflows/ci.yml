# Run tests and on main push create prerelease with npm package + action bundle.
# Promote the GitHub release (uncheck prerelease) to publish to npm via npm-release.yml.

name: CI (test, prerelease)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; release job elevates contents: write.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      - name: Build JS bundle
        run: npm run build

      - name: Node CLI smoke
        run: npm run test:node

  release:
    name: Release (prerelease + npm tarball)
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Build JS bundle (required for sem action)
        run: npm run build

      - name: Next version via sem (dry-run)
        id: sem
        uses: ./
        with:
          dry_run: true
          config: |
            branches:
              - main
            plugins:
              - "@sem/commit-analyzer"
              - "@sem/release-notes-generator"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip when no bump
        id: gate
        run: |
          if [ "${{ steps.sem.outputs.new_release_published }}" != "true" ]; then
            echo "::notice::No version bump — skipping prerelease (#86 soft-skip)."
            echo "continue=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "continue=true" >> "$GITHUB_OUTPUT"
          echo "version=${{ steps.sem.outputs.new_release_version }}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${{ steps.sem.outputs.new_release_version }}"

      - name: Set package version
        if: steps.gate.outputs.continue == 'true'
        run: |
          node -e "
          const fs = require('fs');
          const p = require('./package.json');
          p.version = process.env.VERSION;
          fs.writeFileSync('./package.json', JSON.stringify(p, null, 2) + '\n');
          "
        env:
          VERSION: ${{ steps.gate.outputs.version }}

      - name: Pack npm tarball
        if: steps.gate.outputs.continue == 'true'
        run: |
          npm pack
          mv tishlang-sem-*.tgz tishlang-sem-npm-package.tgz

      - name: Commit dist and push release branch
        if: steps.gate.outputs.continue == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="release/v${VERSION}"
          git checkout -B "$BRANCH"
          # Ensure action consumers get the JS bundle on this ref
          git add -f dist/sem.js dist/cli.js dist/action.js package.json
          git commit -m "chore(release): v${VERSION} [skip ci]" || true
          git push origin "$BRANCH" --force

      # Dogfood @sem/github: tag + prerelease + asset upload (tish promote-style).
      # Uncheck "Set as a pre-release" on the GitHub Release → npm-release.yml publishes.
      - name: Tag + GitHub prerelease via @sem/github
        if: steps.gate.outputs.continue == 'true'
        uses: ./
        with:
          force: ${{ steps.gate.outputs.version }}
          config: |
            branches:
              - "release/*"
              - main
            plugins:
              - "@sem/commit-analyzer"
              - "@sem/release-notes-generator"
              - - "@sem/npm"
                - npmPublish: false
              - - "@sem/github"
                - prerelease: true
                  targetCommitish: "release/v${{ steps.gate.outputs.version }}"
                  successComment: false
                  assets:
                    - path: tishlang-sem-npm-package.tgz
                      name: tishlang-sem-npm-package.tgz
                      label: "npm package (@tishlang/sem)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rolling major action tag
        if: steps.gate.outputs.continue == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          git tag -f "v${MAJOR}"
          git push origin "v${MAJOR}" --force
