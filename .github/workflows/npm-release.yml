# Publish @tishlang/sem to npm when a GitHub release is promoted from prerelease.
# Downloads the prebuilt tarball from the release (no rebuild).
#
# AUTH: npm OIDC trusted publishing. One-time setup on npmjs.com for @tishlang/sem:
#   Organization or user: tishlang
#   Repository:           sem
#   Workflow filename:    npm-release.yml
# Requires npm >= 11.5.1 and id-token: write.

name: NPM release

on:
  release:
    types: [published, edited]

jobs:
  publish:
    name: Publish to npm
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Download npm package tarball from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS='${{ toJSON(github.event.release.assets) }}'
          URL=$(echo "$ASSETS" | jq -r '.[] | select(.name == "tishlang-sem-npm-package.tgz") | .url')
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            # Fall back to live API (event payload can be stale)
            RELEASE_ID="${{ github.event.release.id }}"
            URL=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" \
              | jq -r '.[] | select(.name == "tishlang-sem-npm-package.tgz") | .url')
          fi
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "Release has no asset tishlang-sem-npm-package.tgz"
            exit 1
          fi
          curl -sL -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/octet-stream" \
            "$URL" -o tishlang-sem-npm-package.tgz

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for OIDC trusted publishing (needs >= 11.5.1)
        run: |
          npm install -g "npm@^11"
          npm --version

      - name: Publish @tishlang/sem to npm
        run: npm publish tishlang-sem-npm-package.tgz --access public

      - name: Update release description with npm URL
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          NPM_URL="https://www.npmjs.com/package/@tishlang/sem/v/${VERSION}"
          RELEASE_ID="${{ github.event.release.id }}"
          REPO="${{ github.repository }}"
          CURRENT_BODY=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${REPO}/releases/${RELEASE_ID}" | jq -r '.body // ""')
          NEW_BODY="${CURRENT_BODY}

          ---
          Published to npm: ${NPM_URL}
          GitHub Action: uses: ${REPO}@${TAG}"
          curl -s -X PATCH \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/releases/${RELEASE_ID}" \
            -d "$(printf '%s' "$NEW_BODY" | jq -Rs '{body: .}')"
